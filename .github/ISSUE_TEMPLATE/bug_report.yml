name: Bug report
description: Report a reproducible problem using non-sensitive examples.
title: "[Bug] "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing
      options:
        - label: This report contains no API keys, personal notes, account identifiers, or private logs.
          required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Apple Silicon or Intel, app version or commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small synthetic example. For API issues, include the protocol and model identifier, never the key or private request content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional cropped screenshot or concise error message. Do not upload your library, credentials file, or full logs.
