name: Feature request
description: Describe a learning or note-taking task that could work better.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: Include an example and any alternatives you have tried.
    validations:
      required: true
